name: Import CC0 Rigged Human into KISEKI Feature Branch

on:
  push:
    branches:
      - feat/kiseki-real-world-rebuild
    paths:
      - .github/workflows/import-cc0-avatar.yml

permissions:
  contents: write

jobs:
  import_cc0:
    if: github.ref_name == 'feat/kiseki-real-world-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download known CC0 humanoid GLB
        run: |
          set -euo pipefail
          mkdir -p public/models
          curl -fLsS --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb \
            -o public/models/quaternius-human-cc0.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct
          file = Path("public/models/quaternius-human-cc0.glb")
          data = file.read_bytes()
          assert data[:4] == b"glTF", "invalid GLB magic"
          version, total_bytes = struct.unpack_from("<II", data, 4)
          assert version == 2 and total_bytes == len(data), "malformed GLB"
          assert len(data) == 698560, f"Unexpected upstream GLB length: {len(data)}"
          print("Valid CC0 rigged GLB (v2), bytes:",len(data))
          PY
      - name: Commit independently verified asset into feature branch only
        run: |
          set -euo pipefail
          git config user.name "KISEKI Asset Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/quaternius-human-cc0.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(character): import original CC0 Quaternius rigged GLB"
          git push origin HEAD:feat/kiseki-real-world-rebuild
